server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  # dev-friendly: always revalidate so edits show up immediately
  add_header Cache-Control "no-cache";
  location / { try_files $uri $uri/ =404; }
  location ~ \.md$ { default_type text/plain; add_header Cache-Control "no-cache"; }
}
